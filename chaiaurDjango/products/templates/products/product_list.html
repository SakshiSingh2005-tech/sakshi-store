<!DOCTYPE html>
<html>
<head>
    <title>Sakshi Store</title>
</head>
<body>

    <h1>Welcome to Sakshi Store 🛒</h1>

    {% for product in products %}
        <div>
            <h2>{{ product.name }}</h2>

            <p>{{ product.description }}</p>

            <p>₹{{ product.price }}</p>

            {% if product.image %}
                <img src="{{ product.image.url }}" width="200">
            {% endif %}
        </div>

        <hr>
    {% endfor %}

</body>
</html>
