<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Successful - Sakshi Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .success-container {
            width: 90%;
            max-width: 600px;
            margin: 80px auto;
            background: white;
            padding: 50px 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        .success-icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 15px;
        }

        .message {
            color: #666;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 13px 25px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn:hover {
            background: #333;
        }

        footer {
            text-align: center;
            background: #111;
            color: white;
            padding: 25px;
            margin-top: 100px;
        }
    </style>
</head>

<body>

<div class="success-container">

    <div class="success-icon">
        ✅
    </div>

    <h1>Order Placed Successfully!</h1>

    <p class="message">
        Thank you, <strong>{{ name }}</strong>! ❤️
        <br>
        Your order has been successfully placed.
    </p>

    <p class="total">
        Order Total: ₹{{ total }}
    </p>

    <a href="{% url 'product_list' %}" class="btn">
        🛍️ Continue Shopping
    </a>

</div>

<footer>
    <p>© 2026 Sakshi Store. All rights reserved.</p>
</footer>

</body>
</html>
