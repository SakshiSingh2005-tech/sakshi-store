<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Sakshi Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px 6%;
        }

        header h1 {
            font-size: 28px;
        }

        .checkout-container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 30px;
        }

        .checkout-box,
        .order-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .grand-total {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .place-order {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #111;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .place-order:hover {
            background: #333;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            color: #111;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            background: #111;
            color: white;
            padding: 25px;
            margin-top: 50px;
        }

        @media (max-width: 700px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🛍️ Sakshi Store - Checkout</h1>
</header>

<div class="checkout-container">

    <!-- Customer Details -->

    <div class="checkout-box">

        <h2>Customer Details</h2>
        <form method="POST" action="{% url 'checkout' %}">
    {% csrf_token %}

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" placeholder="Enter phone number" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter email">
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea name="address"
                          placeholder="Enter your full address"
                          required></textarea>
            </div>

            <div class="form-group">
                <label>City</label>
                <input type="text" name="city" placeholder="Enter city" required>
            </div>

            <div class="form-group">
                <label>Pincode</label>
                <input type="text" name="pincode" placeholder="Enter pincode" required>
            </div>

            <button type="submit" class="place-order">
                📦 Place Order
            </button>

        </form>

        <a href="{% url 'cart' %}" class="back">
            ← Back to Cart
        </a>

    </div>


    <!-- Order Summary -->

    <div class="order-box">

        <h2>Order Summary</h2>

        {% for item in products %}

        <div class="order-item">

            <div>
                <strong>{{ item.product.name }}</strong>
                <br>
                Quantity: {{ item.quantity }}
            </div>

            <div>
                ₹{{ item.item_total }}
            </div>

        </div>

        {% endfor %}

        <div class="grand-total">

            <span>Total</span>

            <span>₹{{ total }}</span>

        </div>

    </div>

</div>

<footer>
    <p>© 2026 Sakshi Store. All rights reserved.</p>
</footer>

</body>
</html>
